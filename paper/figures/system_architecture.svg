<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 680" width="100%" height="100%" style="background-color: #ffffff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Gradients -->
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <linearGradient id="inputGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#eff6ff" />
      <stop offset="100%" stop-color="#dbeafe" />
    </linearGradient>
    <linearGradient id="roiGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f0fdf4" />
      <stop offset="100%" stop-color="#dcfce7" />
    </linearGradient>
    <linearGradient id="secGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fefce8" />
      <stop offset="100%" stop-color="#fef08a" />
    </linearGradient>
    <linearGradient id="txGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f5f3ff" />
      <stop offset="100%" stop-color="#ede9fe" />
    </linearGradient>
    <linearGradient id="rxGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fff1f2" />
      <stop offset="100%" stop-color="#ffe4e6" />
    </linearGradient>

    <!-- Markers -->
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#475569" />
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb" />
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#16a34a" />
    </marker>

    <!-- Drop Shadows -->
    <filter id="cardShadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.08" />
    </filter>
  </defs>

  <!-- Title Banner -->
  <rect x="30" y="20" width="1040" height="60" rx="8" fill="url(#headerGrad)" />
  <text x="50" y="45" font-size="18" font-weight="700" fill="#ffffff">MediLink-DL: End-to-End System Architecture</text>
  <text x="50" y="65" font-size="12" font-weight="400" fill="#bfdbfe">A Deep Learning-Guided, Bandwidth-Adaptive, and Secure Framework for Rural Telemedicine Transmission</text>

  <!-- STAGE 1: Image Acquisition & ROI -->
  <g transform="translate(30, 105)">
    <rect width="185" height="420" rx="8" fill="url(#inputGrad)" stroke="#bfdbfe" stroke-width="1.5" filter="url(#cardShadow)" />
    <rect x="0" y="0" width="185" height="36" rx="8" fill="#1d4ed8" />
    <text x="12" y="23" font-size="13" font-weight="700" fill="#ffffff">1. Image &amp; ROI Ingestion</text>

    <!-- Sub-boxes -->
    <rect x="15" y="55" width="155" height="68" rx="6" fill="#ffffff" stroke="#93c5fd" />
    <text x="25" y="75" font-size="11" font-weight="700" fill="#1e3a8a">Grayscale Radiograph</text>
    <text x="25" y="92" font-size="10" fill="#475569">Format: 2D uint8 (0-255)</text>
    <text x="25" y="106" font-size="10" fill="#475569">Dim: 512x512 CXR Phantom</text>

    <path d="M 92 123 L 92 145" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)" />

    <rect x="15" y="148" width="155" height="65" rx="6" fill="#ffffff" stroke="#93c5fd" />
    <text x="25" y="168" font-size="11" font-weight="700" fill="#1e3a8a">Format Validation</text>
    <text x="25" y="184" font-size="10" fill="#475569">• Range &amp; Dimension check</text>
    <text x="25" y="198" font-size="10" fill="#475569">• Corrupt file interception</text>

    <path d="M 92 213 L 92 235" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)" />

    <rect x="15" y="238" width="155" height="85" rx="6" fill="#ffffff" stroke="#93c5fd" />
    <text x="25" y="258" font-size="11" font-weight="700" fill="#1e3a8a">Diagnostic ROI Mask</text>
    <text x="25" y="274" font-size="10" fill="#475569">• Ground-truth lesion mask</text>
    <text x="25" y="288" font-size="10" fill="#475569">• Bounding Box: [T,L,B,R]</text>
    <text x="25" y="304" font-size="9" fill="#2563eb" font-style="italic">Opt: Grad-CAM Saliency</text>

    <!-- Annotation badge -->
    <rect x="15" y="340" width="155" height="65" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-dasharray="3,3" />
    <text x="25" y="358" font-size="10" font-weight="700" fill="#334155">Synthetic Disclaimer</text>
    <text x="25" y="374" font-size="9" fill="#64748b">Permanent watermark</text>
    <text x="25" y="388" font-size="9" fill="#64748b">stamped on bottom banner</text>
  </g>

  <!-- Arrow Stage 1 -> 2 -->
  <path d="M 215 255 L 245 255" stroke="#2563eb" stroke-width="2" marker-end="url(#arrowBlue)" />

  <!-- STAGE 2: ROI-Aware Dual-Stream Compression -->
  <g transform="translate(250, 105)">
    <rect width="195" height="420" rx="8" fill="url(#roiGrad)" stroke="#bbf7d0" stroke-width="1.5" filter="url(#cardShadow)" />
    <rect x="0" y="0" width="195" height="36" rx="8" fill="#16a34a" />
    <text x="12" y="23" font-size="13" font-weight="700" fill="#ffffff">2. Dual-Stream Coding</text>

    <!-- High quality stream -->
    <rect x="15" y="55" width="165" height="75" rx="6" fill="#ffffff" stroke="#86efac" />
    <text x="25" y="75" font-size="11" font-weight="700" fill="#15803d">High-Fidelity ROI Crop</text>
    <text x="25" y="92" font-size="10" fill="#475569">Quality: q_roi = 90 (High)</text>
    <text x="25" y="106" font-size="10" fill="#475569">Local crop: ~3-4 KB</text>
    <text x="25" y="120" font-size="9" fill="#16a34a" font-weight="600">Preserves subtle pathology</text>

    <!-- Low quality stream -->
    <rect x="15" y="145" width="165" height="75" rx="6" fill="#ffffff" stroke="#86efac" />
    <text x="25" y="165" font-size="11" font-weight="700" fill="#15803d">Context Background</text>
    <text x="25" y="182" font-size="10" fill="#475569">Quality: q_bg = 25 (Lossy)</text>
    <text x="25" y="196" font-size="10" fill="#475569">Full raster: ~6-7 KB</text>
    <text x="25" y="210" font-size="9" fill="#64748b">Aggressive rate reduction</text>

    <path d="M 97 220 L 97 242" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)" />

    <!-- Binary Serialization -->
    <rect x="15" y="245" width="165" height="90" rx="6" fill="#ffffff" stroke="#86efac" />
    <text x="25" y="265" font-size="11" font-weight="700" fill="#15803d">Payload Serialization</text>
    <text x="25" y="280" font-size="10" fill="#334155">• Header: 26-byte 'MLDL'</text>
    <text x="25" y="294" font-size="9" fill="#64748b">  [H, W, q_roi, q_bg, bbox, lens]</text>
    <text x="25" y="308" font-size="10" fill="#334155">• BG stream + ROI stream</text>
    <text x="25" y="324" font-size="10" font-weight="700" fill="#15803d">Total: 9.8 KB (26.6x ratio)</text>

    <!-- Uniform comparator box -->
    <rect x="15" y="348" width="165" height="58" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-dasharray="3,3" />
    <text x="22" y="366" font-size="10" font-weight="700" fill="#475569">Matched Uniform Baseline</text>
    <text x="22" y="380" font-size="9" fill="#64748b">Dynamic sweep: q=32 (9.6 KB)</text>
    <text x="22" y="394" font-size="9" fill="#64748b">Fair bit-budget benchmarking</text>
  </g>

  <!-- Arrow Stage 2 -> 3 -->
  <path d="M 445 255 L 475 255" stroke="#16a34a" stroke-width="2" marker-end="url(#arrowGreen)" />

  <!-- STAGE 3: Cryptographic Envelope -->
  <g transform="translate(480, 105)">
    <rect width="180" height="420" rx="8" fill="url(#secGrad)" stroke="#fde047" stroke-width="1.5" filter="url(#cardShadow)" />
    <rect x="0" y="0" width="180" height="36" rx="8" fill="#ca8a04" />
    <text x="12" y="23" font-size="13" font-weight="700" fill="#ffffff">3. Security Envelope</text>

    <rect x="15" y="55" width="150" height="70" rx="6" fill="#ffffff" stroke="#facc15" />
    <text x="23" y="75" font-size="11" font-weight="700" fill="#854d0e">AES-256-GCM AEAD</text>
    <text x="23" y="92" font-size="10" fill="#475569">• Authenticated Cipher</text>
    <text x="23" y="106" font-size="10" fill="#475569">• Symmetric 256-bit Key</text>
    <text x="23" y="118" font-size="9" fill="#ca8a04">CSPRNG Key Generation</text>

    <path d="M 90 125 L 90 148" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)" />

    <rect x="15" y="152" width="150" height="72" rx="6" fill="#ffffff" stroke="#facc15" />
    <text x="23" y="172" font-size="11" font-weight="700" fill="#854d0e">Nonce &amp; Tag Discipline</text>
    <text x="23" y="188" font-size="10" fill="#475569">• 96-bit fresh Nonce</text>
    <text x="23" y="202" font-size="10" fill="#475569">• 128-bit Poly1305 Tag</text>
    <text x="23" y="216" font-size="9" fill="#16a34a">Overhead: 28 bytes total</text>

    <path d="M 90 224 L 90 248" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)" />

    <rect x="15" y="252" width="150" height="80" rx="6" fill="#ffffff" stroke="#facc15" />
    <text x="23" y="272" font-size="11" font-weight="700" fill="#854d0e">Tamper Resistance</text>
    <text x="23" y="288" font-size="10" fill="#475569">• 1-bit mutation detected</text>
    <text x="23" y="302" font-size="10" fill="#475569">• 100% rejection rate</text>
    <text x="23" y="316" font-size="9" fill="#ca8a04">Rejects active MITM</text>

    <rect x="15" y="345" width="150" height="60" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-dasharray="3,3" />
    <text x="22" y="365" font-size="10" font-weight="700" fill="#475569">Latency Overhead</text>
    <text x="22" y="380" font-size="9" fill="#64748b">Enc Time: ~0.005 ms</text>
    <text x="22" y="394" font-size="9" fill="#64748b">Dec Time: ~0.002 ms</text>
  </g>

  <!-- Arrow Stage 3 -> 4 -->
  <path d="M 660 255 L 690 255" stroke="#ca8a04" stroke-width="2" marker-end="url(#arrow)" />

  <!-- STAGE 4: Simulated Rural Network -->
  <g transform="translate(695, 105)">
    <rect width="185" height="420" rx="8" fill="url(#txGrad)" stroke="#ddd6fe" stroke-width="1.5" filter="url(#cardShadow)" />
    <rect x="0" y="0" width="185" height="36" rx="8" fill="#7c3aed" />
    <text x="12" y="23" font-size="13" font-weight="700" fill="#ffffff">4. Adaptive Transport</text>

    <rect x="15" y="55" width="155" height="75" rx="6" fill="#ffffff" stroke="#c4b5fd" />
    <text x="23" y="75" font-size="11" font-weight="700" fill="#5b21b6">Priority Scheduling</text>
    <text x="23" y="90" font-size="10" fill="#1e3a8a">• Header Pkt: Priority 30</text>
    <text x="23" y="104" font-size="10" fill="#15803d">• ROI Pkts: Priority 20</text>
    <text x="23" y="118" font-size="10" fill="#6b7280">• BG Pkts: Priority 5</text>

    <path d="M 92 130 L 92 150" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)" />

    <rect x="15" y="154" width="155" height="85" rx="6" fill="#ffffff" stroke="#c4b5fd" />
    <text x="23" y="174" font-size="11" font-weight="700" fill="#5b21b6">Channel Simulation</text>
    <text x="23" y="190" font-size="10" fill="#475569">• BW: 48-128 kbps (2G/3G)</text>
    <text x="23" y="204" font-size="10" fill="#475569">• Latency: 120-500 ms RTT</text>
    <text x="23" y="218" font-size="10" fill="#475569">• Packet Loss: 2% - 10%</text>
    <text x="23" y="232" font-size="9" fill="#7c3aed">Chunk Size: 1024 bytes</text>

    <path d="M 92 239 L 92 258" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)" />

    <rect x="15" y="262" width="155" height="72" rx="6" fill="#ffffff" stroke="#c4b5fd" />
    <text x="23" y="282" font-size="11" font-weight="700" fill="#5b21b6">Selective ARQ &amp; Buffer</text>
    <text x="23" y="298" font-size="10" fill="#475569">• SHA-256 Checksum check</text>
    <text x="23" y="312" font-size="10" fill="#475569">• Timeout retransmission</text>
    <text x="23" y="326" font-size="9" fill="#16a34a">Store-and-Forward queue</text>

    <rect x="15" y="345" width="155" height="60" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-dasharray="3,3" />
    <text x="22" y="365" font-size="10" font-weight="700" fill="#475569">Triage Acceleration</text>
    <text x="22" y="380" font-size="9" fill="#15803d" font-weight="700">ROI Time: 0.38 - 0.59 s</text>
    <text x="22" y="394" font-size="9" fill="#64748b">(vs 3.5 - 5.8 s for FIFO)</text>
  </g>

  <!-- Arrow Stage 4 -> 5 -->
  <path d="M 880 255 L 910 255" stroke="#7c3aed" stroke-width="2" marker-end="url(#arrow)" />

  <!-- STAGE 5: Receiver & Quality Evaluation -->
  <g transform="translate(915, 105)">
    <rect width="155" height="420" rx="8" fill="url(#rxGrad)" stroke="#fecdd3" stroke-width="1.5" filter="url(#cardShadow)" />
    <rect x="0" y="0" width="155" height="36" rx="8" fill="#e11d48" />
    <text x="12" y="23" font-size="13" font-weight="700" fill="#ffffff">5. Receiver &amp; Audit</text>

    <rect x="12" y="55" width="131" height="65" rx="6" fill="#ffffff" stroke="#fda4af" />
    <text x="20" y="75" font-size="11" font-weight="700" fill="#9f1239">Stream Reassembly</text>
    <text x="20" y="92" font-size="10" fill="#475569">Order sequence</text>
    <text x="20" y="106" font-size="10" fill="#475569">Checksum verify</text>

    <path d="M 77 120 L 77 142" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)" />

    <rect x="12" y="146" width="131" height="68" rx="6" fill="#ffffff" stroke="#fda4af" />
    <text x="20" y="166" font-size="11" font-weight="700" fill="#9f1239">Decryption &amp; Auth</text>
    <text x="20" y="182" font-size="10" fill="#475569">AEAD verify tag</text>
    <text x="20" y="196" font-size="10" fill="#15803d">Payload authenticated</text>

    <path d="M 77 214 L 77 236" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)" />

    <rect x="12" y="240" width="131" height="70" rx="6" fill="#ffffff" stroke="#fda4af" />
    <text x="20" y="260" font-size="11" font-weight="700" fill="#9f1239">Reconstruction</text>
    <text x="20" y="276" font-size="10" fill="#475569">Composite ROI crop</text>
    <text x="20" y="290" font-size="10" fill="#475569">over context frame</text>

    <path d="M 77 310 L 77 332" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)" />

    <rect x="12" y="336" width="131" height="72" rx="6" fill="#ffffff" stroke="#fda4af" />
    <text x="20" y="354" font-size="11" font-weight="700" fill="#9f1239">Distortion Metrics</text>
    <text x="20" y="370" font-size="9" fill="#15803d" font-weight="700">ROI PSNR: 38.08 dB</text>
    <text x="20" y="384" font-size="9" fill="#15803d" font-weight="700">ROI SSIM: 0.9293</text>
    <text x="20" y="398" font-size="9" fill="#64748b">Export to metrics.csv</text>
  </g>

  <!-- Bottom Legend Bar -->
  <g transform="translate(30, 550)">
    <rect width="1040" height="105" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" />
    <text x="20" y="24" font-size="12" font-weight="700" fill="#1e293b">Architectural Verification &amp; Research Boundary Notes:</text>

    <circle cx="30" cy="46" r="5" fill="#16a34a" />
    <text x="42" y="50" font-size="10.5" font-weight="600" fill="#15803d">Implemented &amp; Verified:</text>
    <text x="195" y="50" font-size="10.5" fill="#334155">Dual-stream JPEG compression, rate-matched uniform baseline, partitioned PSNR/SSIM, AES-256-GCM AEAD, priority queue transmission.</text>

    <circle cx="30" cy="68" r="5" fill="#eab308" />
    <text x="42" y="72" font-size="10.5" font-weight="600" fill="#a16207">Experimental Prototype:</text>
    <text x="195" y="72" font-size="10.5" fill="#334155">Grad-CAM saliency hooks &amp; thresholding validated algorithmically on demonstration CNN; not yet wired to live pipeline.</text>

    <circle cx="30" cy="90" r="5" fill="#64748b" />
    <text x="42" y="94" font-size="10.5" font-weight="600" fill="#475569">Scope &amp; Data Ethics:</text>
    <text x="195" y="94" font-size="10.5" fill="#334155">Evaluated strictly on synthetic phantom radiographs (watermarked). Zero unverified clinical claims. Application-level channel simulation.</text>
  </g>
</svg>
